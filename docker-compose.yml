version: '3'

services:
  nginx:
    image: nginx:latest
    ports:
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./cert.crt:/etc/nginx/cert.crt
      - ./cert.key:/etc/nginx/cert.key
    depends_on:
      - frontend
      - backend

  frontend:
    build: 
      context: ./front
    expose:
      - "5173"
    depends_on:
      - backend

  backend:
    build: 
      context: ./back
    expose:
      - "8000"